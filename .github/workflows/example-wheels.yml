name: Example wheels

# examples/coremark, examples/lua and examples/quickjs are packages whose extension is made by wasmext from a .wasm, and examples/products one
# whose shared library and program are: cibuildwheel builds their wheels on every platform, with the wasmext of this checkout as the build tool.

on:
  push:
    paths-ignore:
      - "**.md"
  pull_request:
    paths-ignore:
      - "**.md"
  workflow_dispatch:

concurrency:
  group: example-wheels-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-wasmext:
    name: Build the wasmext wheel
    runs-on: ubuntu-latest
    # a branch of this repository is run by its push; a pull request is run only when it comes from a fork (a push to a fork is not seen here)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # setuptools-scm

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.11"
          github-token: ${{ github.token }}

      - name: Build the wheel
        run: uv build --wheel --out-dir dist
        shell: bash

      - name: Upload the wheel
        uses: actions/upload-artifact@v7
        with:
          name: wasmext-wheel
          path: ./dist
          retention-days: 7

  build-example:
    name: ${{ matrix.example }} on ${{ matrix.name }}
    needs: build-wasmext
    strategy:
      fail-fast: false
      matrix:
        example: [coremark, lua, quickjs, products]
        name:
          - Linux x64
          - Linux ARM64
          - Windows x64
          - Windows x86
          - Windows ARM64
          - macOS Apple Silicon
          - macOS Intel
        include:
          - { name: "Linux x64", os: ubuntu-latest, archs: "x86_64" }
          - { name: "Linux ARM64", os: ubuntu-24.04-arm, archs: "aarch64" }
          - { name: "Windows x64", os: windows-latest, archs: "AMD64" }
          - { name: "Windows x86", os: windows-latest, archs: "x86" }
          - { name: "Windows ARM64", os: windows-11-arm, archs: "ARM64" }
          - { name: "macOS Apple Silicon", os: macos-26, archs: "arm64" }
          - { name: "macOS Intel", os: macos-26-intel, archs: "x86_64" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Download the wasmext wheel
        uses: actions/download-artifact@v8
        with:
          name: wasmext-wheel
          path: examples/${{ matrix.example }}/deps

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          github-token: ${{ github.token }}

      - name: Build the wheels
        env:
          # Without build isolation, so that the wasmext of the checkout (and wabt-package, its dependency, from PyPI)
          # is what the build uses.
          CIBW_BUILD_FRONTEND: "build; args: --no-isolation"
          CIBW_BEFORE_BUILD: pip install --find-links {package}/deps wasmext setuptools
        run: uvx cibuildwheel examples/${{ matrix.example }} --output-dir wheelhouse --archs ${{ matrix.archs }}
        shell: bash

      - name: list ./wheelhouse
        run: ls ./wheelhouse
        shell: bash

      - name: Upload the wheels
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.example }}-wheels-${{ matrix.os }}-${{ matrix.archs }}
          path: ./wheelhouse
          retention-days: 7

  # The abi3 wheel (cp311-abi3) is one wheel for every CPython from 3.11 on, but cibuildwheel tests it on the interpreter that built it (3.11): this installs
  # the wheel that the Linux x64 job made into the newer interpreters and runs the tests of the example there.
  abi3-wheel-on-newer-pythons:
    name: the abi3 wheel of coremark on Python ${{ matrix.python }}
    needs: build-example
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14", "3.15"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Download the wheels
        uses: actions/download-artifact@v8
        with:
          name: coremark-wheels-ubuntu-latest-x86_64
          path: wheels

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: ${{ matrix.python }}
          github-token: ${{ github.token }}

      - name: Install the abi3 wheel
        run: |
          ls wheels
          uv venv --python ${{ matrix.python }} "$RUNNER_TEMP/abi3"
          uv pip install --python "$RUNNER_TEMP/abi3" wheels/*-abi3-manylinux*.whl pytest  # the glibc one: the musllinux wheel is for Alpine
        shell: bash

      # not from the checkout: the source of the example must not be what the tests import
      - name: Test
        working-directory: ${{ runner.temp }}
        run: ./abi3/bin/python -m pytest "$GITHUB_WORKSPACE/examples/coremark/tests" -q -p no:cacheprovider
        shell: bash

  # The platforms that the desktop matrix above has not: the other Linux architectures (under QEMU where the runner has not the processor),
  # Pyodide, and Android (built, not run: there is no emulator of arm64 on the runner). coremark only: it is small, and these are slow.
  build-example-extra:
    name: coremark on ${{ matrix.name }}
    needs: build-wasmext
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "Linux ARMv7", os: ubuntu-24.04-arm, platform: linux, archs: "armv7l" }
          - { name: "Linux i686", os: ubuntu-latest, platform: linux, archs: "i686" }
          - { name: "Linux ppc64le", os: ubuntu-latest, platform: linux, archs: "ppc64le", qemu: true }
          - { name: "Linux riscv64", os: ubuntu-latest, platform: linux, archs: "riscv64", qemu: true }
          - { name: "Pyodide", os: ubuntu-latest, platform: pyodide, archs: "wasm32", build: "cp313-*" }
          - { name: "Android arm64", os: ubuntu-latest, platform: android, archs: "arm64_v8a", build: "cp313-*", skip_tests: true }
          # the emulator has the architecture of the runner, so only an x86-64 wheel is tested (with KVM, which cibuildwheel sets up)
          - { name: "Android x86_64", os: ubuntu-latest, platform: android, archs: "x86_64", build: "cp313-*" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Download the wasmext wheel
        uses: actions/download-artifact@v8
        with:
          name: wasmext-wheel
          path: examples/coremark/deps

      - name: Set up QEMU for the emulated architectures
        if: ${{ matrix.qemu }}
        uses: docker/setup-qemu-action@v4
        with:
          platforms: all

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          github-token: ${{ github.token }}

      - name: Build the wheels
        env:
          CIBW_BUILD_FRONTEND: "build; args: --no-isolation"
          CIBW_BEFORE_BUILD: pip install --find-links {package}/deps wasmext setuptools
          CIBW_BUILD: ${{ matrix.build || 'cp311-* cp314t-* cp315t-*' }}
          CIBW_TEST_SKIP: ${{ matrix.skip_tests && '*' || '' }}
          # Android and Pyodide are built on the host: cibuildwheel installs build-system.requires itself, and pip has to find the wheel of wasmext
          PIP_FIND_LINKS: ${{ (matrix.platform == 'android' || matrix.platform == 'pyodide') && format('{0}/examples/coremark/deps', github.workspace) || '' }}
        # from the folder of the example: test-sources (Android) is relative to the folder cibuildwheel is run in
        working-directory: examples/coremark
        run: uvx cibuildwheel --platform ${{ matrix.platform }} --archs ${{ matrix.archs }} --output-dir wheelhouse
        shell: bash

      - name: list ./wheelhouse
        run: ls examples/coremark/wheelhouse
        shell: bash

      - name: Upload the wheels
        uses: actions/upload-artifact@v7
        with:
          name: coremark-wheels-${{ matrix.platform }}-${{ matrix.archs }}
          path: examples/coremark/wheelhouse
          retention-days: 7
