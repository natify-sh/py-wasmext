default_install_hook_types: [pre-commit]
default_language_version:
  python: python3

repos:
  - repo: local
    hooks:
      - id: uv-lock-check
        name: uv lock check
        entry: uv
        args: ["lock", "--check"]
        language: system
        pass_filenames: false

      - id: uv-sync
        name: uv sync before hooks
        entry: uv
        args: ["sync", "--python", "cpython-3.11"]
        language: system
        pass_filenames: false
        files: '^(pyproject\.toml|uv\.lock|setup\.py)$|\.py$'

      - id: uv-pyright
        name: pyright
        entry: uv
        args: ["run", "pyright"]
        language: system
        pass_filenames: false
        files: '\.py$'

      - id: uv-ruff-check
        name: ruff lint & fix
        entry: uv
        args: ["run", "ruff", "check", "--fix"]
        language: system
        pass_filenames: false
        files: '\.py$'

      - id: uv-ruff-format
        name: ruff format
        entry: uv
        args: ["run", "ruff", "format"]
        language: system
        pass_filenames: false
        files: '\.py$'

      - id: uv-pytest
        name: uv run pytest
        entry: uv
        args: ["run", "pytest"]
        language: system
        pass_filenames: false
        files: '\.py$'
