name: Core without Python

# Check (a) of the "C first" plan (FEATURES.md, item 10): the core of WASI (wasi_core.h with the two snapshots) compiles with no Python on the
# include path, so the layers stay apart. Only the compiler and the runtime of wasm2c (wasm-rt.h) are given. On Windows (MSVC) the file backend
# is wasi_files_win32.h (Win32 only), since stage 3a of the plan.

on:
  push:
    branches: [main] # a branch with a pull request is run by the pull request alone, not twice
    paths:
      - "src/wasmext/c/**"
      - ".github/workflows/core-without-python.yml"
  pull_request:
    paths:
      - "src/wasmext/c/**"
      - ".github/workflows/core-without-python.yml"
  workflow_dispatch:

concurrency:
  group: core-without-python-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  core:
    name: ${{ matrix.os }} ${{ matrix.cc }}
    runs-on: ${{ matrix.os }}
    # a branch of this repository is run by its push; a pull request is run only when it comes from a fork (a push to a fork is not seen here)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, cc: gcc }
          - { os: ubuntu-latest, cc: clang }
          - { os: macos-latest, cc: clang }
          - { os: windows-latest, cc: msvc }
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.11"
          github-token: ${{ github.token }}

      # Python is used here only to find wasm-rt.h; it is not on the include path of the compiler below.
      - name: Find the runtime of wasm2c
        shell: bash
        run: |
          uv venv .venv
          uv pip install --python .venv wabt-package
          PY=.venv/bin/python
          if [ ! -f "$PY" ]; then PY=.venv/Scripts/python.exe; fi
          echo "WASM_RT=$("$PY" -c 'import wabt_package, pathlib; print(pathlib.Path(wabt_package.__file__).parent / "wasm2c")')" >> "$GITHUB_ENV"
          printf '#include "wasi_core.h"\n#include "wasi_preview1.h"\n#include "wasi_unstable.h"\nint main(void) { return 0; }\n' > core_check.c

      - name: Compile the core with no Python.h
        if: runner.os != 'Windows'
        run: ${{ matrix.cc }} -std=c11 -Wall -Wextra -Wno-unused-parameter -Werror -fsyntax-only -Isrc/wasmext/c -I"$WASM_RT" core_check.c

      - name: Compile the core with no Python.h (MSVC)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          cmd /c "call `"$vs\VC\Auxiliary\Build\vcvars64.bat`" && cl /nologo /W3 /c /Fo:core_check.obj /Isrc\wasmext\c /I`"$env:WASM_RT`" core_check.c"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: The core does not name Python
        shell: bash
        run: |
          if grep -nE "Python\.h|PyObject|Py_|PyErr|PyMem" src/wasmext/c/wasi_core.h src/wasmext/c/wasi_files_win32.h src/wasmext/c/wasi_preview1.h src/wasmext/c/wasi_unstable.h; then
            echo "wasi_core.h and the snapshot headers must not use the Python C API" >&2
            exit 1
          fi
