[build-system]
# wasmext turns the .wasm into an extension (see setup.py); it brings wasm2c with it (wabt-package).
requires = ["setuptools>=77", "wasmext"]
build-backend = "setuptools.build_meta"

[project]
name = "wasmext-example-coremark"
version = "0.1.0"
description = "CoreMark, a WebAssembly module, as a native CPython extension built by wasmext"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools]
package-dir = { "" = "src" }
packages = ["coremark"]
# The .wasm is the source of the extension (the generated C is in build/wasmext/, not part of it): only what package-data
# names goes into the wheel.
include-package-data = false

[tool.setuptools.package-data]
coremark = ["py.typed", "*.pyi"]

[tool.cibuildwheel]
# cp311-* builds the abi3 wheel (every CPython from 3.11 on); cp314t-* has no stable ABI and gets a native one.
build = "cp311-* cp314t-* cp315t-*"
test-requires = "pytest"
test-command = "pytest {package}/tests"

# Android runs the tests on an emulator: a command in Python (no shell on the device), and the tests copied to it.
[[tool.cibuildwheel.overrides]]
select = "*-android_*"
test-sources = ["tests"]
test-command = "python -m pytest tests"

[tool.uv.sources]
# For `uv build` / `uv sync` in a checkout: wasmext (not on PyPI yet) comes from the root of this repository, build requirement included.
# pip and cibuildwheel ignore this table (CI gives them the wheel with --find-links).
wasmext = { path = "../..", editable = false }

[dependency-groups]
dev = ["pytest>=9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
