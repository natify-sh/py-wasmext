[build-system]
# wasmext turns the .wasm into an extension (see setup.py); it brings wasm2c with it (wabt-package).
requires = ["setuptools>=77", "wasmext"]
build-backend = "setuptools.build_meta"

[project]
name = "wasmext-example-coremark"
version = "0.1.0"
description = "CoreMark, a WebAssembly module, as a native CPython extension built by wasmext"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools]
package-dir = { "" = "src" }
packages = ["coremark"]

[tool.setuptools.package-data]
coremark = ["py.typed", "*.pyi"]

[tool.cibuildwheel]
build = "cp311-* cp312-* cp313-* cp314-*"
test-requires = "pytest"
test-command = "pytest {package}/tests"
