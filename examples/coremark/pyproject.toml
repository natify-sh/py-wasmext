[build-system]
# wasmext turns the .wasm into an extension (see setup.py); it brings wasm2c with it (wabt-package).
requires = ["setuptools>=77", "wasmext"]
build-backend = "setuptools.build_meta"

[project]
name = "wasmext-example-coremark"
version = "0.1.0"
description = "CoreMark, a WebAssembly module, as a native CPython extension built by wasmext"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools]
package-dir = { "" = "src" }
packages = ["coremark"]

[tool.setuptools.package-data]
coremark = ["py.typed", "*.pyi"]

[tool.distutils.bdist_wheel]
py-limited-api = "cp311" # with limited_api=True in setup.py: cp311-abi3, for every CPython from 3.11

[tool.cibuildwheel]
build = "cp311-*"  # one interpreter per platform is enough for an abi3 wheel
test-requires = "pytest"
test-command = "pytest {package}/tests"
