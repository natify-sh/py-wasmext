[build-system]
# wasmext turns the .wasm files into extensions (see setup.py); it brings wasm2c with it (wabt-package).
requires = ["setuptools>=84", "wasmext"]
build-backend = "setuptools.build_meta"

[project]
name = "wasmext-example-wasi2-unbundled"
version = "0.1.0"
description = "Core modules taken out of WASI 0.2 components, turned into native CPython extensions by wasmext and run with a host of WASI 0.2 written in Python"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools]
package-dir = { "" = "src" }
packages = ["wasi2demo"]
# The generated C and the .wasm are the sources of the extensions, not part of them.
include-package-data = false

[tool.setuptools.package-data]
wasi2demo = ["py.typed", "*.pyi"]

[tool.uv.sources]
# For `uv build` / `uv sync` in a checkout: wasmext (the one on PyPI is older than this repository) comes from the root of this repository, build requirement included.
wasmext = { path = "../..", editable = false }

[dependency-groups]
dev = ["pytest>=9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
